<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Story Booklet — CYKGP Prototype</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <div>
          <p class="eyebrow">Prototype</p>
          <h1 id="book-title">Can You Know God Personally</h1>
        </div>
        <button type="button" id="download-pdf" class="btn primary">Download PDF</button>
      </header>

      <main class="app-main">
        <aside class="editor-panel">
          <h2>Your story</h2>
          <p class="hint">
            Pages 5–7 in the booklet. Use blank lines between paragraphs. The preview updates as you
            type.
          </p>
          <textarea id="story-editor" spellcheck="true" aria-label="Personal story"></textarea>
          <button type="button" id="jump-story" class="btn subtle">Jump to story (page 5)</button>
        </aside>

        <section class="book-panel" aria-label="Book preview">
          <div class="book-viewport" id="book-viewport">
            <div id="page-stage" class="page-stage"></div>
          </div>
          <nav class="book-controls" aria-label="Page navigation">
            <button type="button" id="prev-page" class="btn" aria-label="Previous page">Previous</button>
            <span id="page-indicator" class="page-indicator">Page 1 of 24</span>
            <button type="button" id="next-page" class="btn" aria-label="Next page">Next</button>
          </nav>
        </section>
      </main>
    </div>

    <div id="layout-host" class="offscreen" aria-hidden="true"></div>
    <div id="export-host" class="offscreen" aria-hidden="true"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
